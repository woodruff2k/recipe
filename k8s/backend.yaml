apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  NODE_ENV: production
  PORT: "4000"
  # port-forward 접근 기준(브라우저 → localhost). Ingress 사용 시 호스트로 변경.
  CORS_ORIGIN: http://localhost:3000
  PUBLIC_BASE_URL: http://localhost:4000
  JWT_EXPIRES_IN: 7d
  STORAGE_DRIVER: local
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  JWT_SECRET: dev-only-secret-change-me
  # DB는 postgres Service(ClusterIP) DNS로 접근
  DATABASE_URL: postgresql://recipe:recipe@postgres:5432/recipe?schema=public
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # DB가 준비될 때까지 대기 (마이그레이션 실패로 인한 CrashLoop 방지)
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432 -U recipe; do echo 'waiting for db'; sleep 2; done"
      containers:
        - name: backend
          # 로컬 빌드 이미지: docker build -t recipe-backend:local -f backend/Dockerfile .
          image: recipe-backend:local
          imagePullPolicy: IfNotPresent
          # 컨테이너 시작 시 (이미지 CMD) prisma migrate deploy → node dist/index.js
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          ports:
            - containerPort: 4000
          # 마이그레이션 + 부팅 시간을 startupProbe로 허용(최대 ~80s)
          startupProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 2
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /repo/backend/uploads
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
