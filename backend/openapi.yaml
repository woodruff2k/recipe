openapi: 3.0.3
info:
  title: RecipeShare API
  description: |
    레시피 작성·공유·탐색 서비스 백엔드 API.
    `backend/src/routes/*.ts`를 분석해 작성한 명세로, 실제 컨트롤러의
    Zod 검증 스키마·에러 응답 포맷과 1:1로 대응한다.

    ## 인증
    `POST /api/auth/register` 또는 `POST /api/auth/login` 응답의 `token`을
    `Authorization: Bearer <token>` 헤더로 보호된 엔드포인트에 사용한다.

    ## 공통 에러 포맷
    모든 에러는 `{ "error": string, "details"?: object }` 형태다.
    Zod 검증 실패는 `error: "Validation failed"` + `details`에
    `ZodError.flatten()` 결과가 담긴다.
  version: "1.0.0"
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:4000
    description: 로컬 개발 서버

tags:
  - name: Health
    description: 서버 상태 확인
  - name: Auth
    description: 회원가입·로그인·프로필 조회/수정
  - name: Recipes
    description: 레시피 CRUD, 검색, 페이지네이션
  - name: Uploads
    description: 레시피 대표 이미지 업로드

security: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: 헬스체크
      security: []
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: 가입 성공 — 자동 로그인 처리된 토큰 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: 이미 등록된 이메일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Email already registered: user@example.com"

  /api/auth/login:
    post:
      operationId: loginUser
      tags: [Auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid email or password"

  /api/auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: 내 프로필 조회
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [Auth]
      summary: 내 프로필 수정 (이름/이메일)
      description: name, email 중 최소 하나는 있어야 한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInput"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 다른 사용자가 이미 쓰는 이메일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/recipes:
    get:
      operationId: listRecipes
      tags: [Recipes]
      summary: 레시피 목록 조회 (검색 + 페이지네이션)
      security: []
      parameters:
        - name: q
          in: query
          description: 제목/설명 대소문자 무시 부분일치 검색어
          schema:
            type: string
        - name: page
          in: query
          description: 페이지 번호(1부터). 숫자가 아니면 1로 처리됨
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 페이지당 개수. 최대 50으로 clamp됨
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
      responses:
        "200":
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
    post:
      operationId: createRecipe
      tags: [Recipes]
      summary: 레시피 작성
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: 작성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/recipes/mine:
    get:
      operationId: listMyRecipes
      tags: [Recipes]
      summary: 내가 작성한 레시피 목록 (마이페이지)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/recipes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Recipe.id (cuid)
    get:
      operationId: getRecipe
      tags: [Recipes]
      summary: 레시피 상세 조회
      security: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    $ref: "#/components/schemas/Recipe"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRecipe
      tags: [Recipes]
      summary: 레시피 수정 (작성자 본인만)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 본인 레시피가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "You can only edit your own recipes"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRecipe
      tags: [Recipes]
      summary: 레시피 삭제 (작성자 본인만)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 삭제 성공 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 본인 레시피가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "You can only delete your own recipes"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/uploads/image:
    post:
      operationId: uploadImage
      tags: [Uploads]
      summary: 이미지 업로드
      description: |
        multipart/form-data, 필드명 `image`. 허용 형식: jpeg/png/webp/gif.
        `MAX_UPLOAD_BYTES` 환경변수로 크기 제한(기본 5MB) — 초과 시 현재
        구현은 500으로 응답한다(멀터 에러가 HttpError로 매핑되어 있지 않음,
        알려진 개선 대상).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: 저장소 내부 키(파일명)
                  url:
                    type: string
                    format: uri
                    description: 클라이언트가 바로 쓸 수 있는 공개 URL
        "400":
          description: 파일 없음 또는 지원하지 않는 형식
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noFile:
                  value: { error: 'No file provided (expected multipart field "image")' }
                unsupportedType:
                  value: { error: "Unsupported file type: text/plain" }
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `POST /api/auth/register` 또는 `/login` 응답의 `token`을
        `Authorization: Bearer <token>` 헤더로 전달한다.

  responses:
    ValidationError:
      description: 요청 바디 검증 실패 (Zod)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: 토큰 누락/만료/무효
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Missing or malformed Authorization header"
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Recipe not found"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object
          nullable: true

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: object
          description: "zod ZodError.flatten() 결과"
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          example: "cm123abc..."
        email:
          type: string
          format: email
        name:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT (7일 만료, JWT_EXPIRES_IN 설정에 따름)
        user:
          $ref: "#/components/schemas/User"

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 60

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    UpdateMeInput:
      type: object
      description: name, email 중 최소 하나 필수
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        email:
          type: string
          format: email

    RecipeAuthor:
      type: object
      nullable: true
      properties:
        id:
          type: string
        name:
          type: string

    Recipe:
      type: object
      required:
        [
          id,
          title,
          description,
          ingredients,
          steps,
          imageUrl,
          authorId,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        ingredients:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        authorId:
          type: string
        author:
          $ref: "#/components/schemas/RecipeAuthor"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RecipeInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        steps:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        imageUrl:
          type: string
          format: uri
          nullable: true

    RecipeListResponse:
      type: object
      required: [recipes, total, page, pageSize, totalPages]
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
